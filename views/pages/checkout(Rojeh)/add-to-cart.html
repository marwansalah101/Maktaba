<body class="Cart-page">
  <nav class="navbar">
          <div id="Maktaba">
              <a href="/home">
                  <h1>Maktaba</h1>
              </a>
          </div>
          <ul class="navrbar-text">
              <li>
                  <a href="/home">
                      Home
                  </a>
              </li>
              <li>
                  <a href="/browse">
                      Browse
                  </a>
              </li>
              <li>
                  <a href="/collection">
                      Collection
                  </a>
              </li>
              <li>
                  <a href="/favorites">
                      Favourites
                  </a>
              </li>
          </ul>
          <div class="navbar-icons">
              <a href="/cart">
                  <span class="material-symbols-outlined">shopping_bag</span>     
              </a>
              <div class="menu-dropdown-wrapper" id="menuWrapper">
                  <span class="material-symbols-outlined" id="menuBtn">menu</span>
              </div>
              <div class="menu-dropdown" id="menuDropdown">
                  <a href="/authors">Authors</a>
                  <a href="/browse#bw-ai-section" class="nav-ai-link">Maktaba AI ✦</a>

              </div>
          </div>
      </nav>




 

  <!-- PAGE -->
  <main class="cart-page-wrapper">
    <div class="cart-board">
      <header class="cart-board-header">
        <div class="cart-heading-group">
          <h1>Your Cart</h1>
          <span id="cart-item-count">0 Items</span>
        </div>
        <div class="cart-total-header">
          <span>Total</span>
          <strong id="cart-page-total">&euro;0.00</strong>
        </div>
      </header>

      <div id="cart-items-container" class="cart-items-list"></div>

      <div class="cart-empty" id="cart-empty-msg">
        <span class="material-symbols-outlined">shopping_bag</span>
        Your cart is empty.<br>
        <a href="/favorites">Go to Favorites &rarr;</a>
      </div>

      <footer class="cart-board-footer">
        <a href="/favorites" class="cart-back-link">Continue shopping</a>
        <button class="checkout-btn" id="checkout-btn" onclick="window.location.href='checkout.html'">Proceed to checkout</button>
      </footer>

      <div class="order-summary-card" aria-hidden="true">
        <span id="summary-subtotal">&euro;0.00</span>
        <span id="summary-shipping">&euro;0.00</span>
        <span id="summary-total">&euro;0.00</span>
      </div>
    </div>
  </main>

  <script src="/data.js"></script>
    <script src="/script.js"></script>
