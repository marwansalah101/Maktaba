<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/preloader.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Maktaba</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/pages/checkout(Rojeh)/checkout.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300..700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" sizes="64x64" href="/resources/asset/Logo.svg">
</head>
<body class="checkout-page payment-page">
    <!-- ── PRELOADER ────────────────────────────────────────── -->
    <div id="mkt-preloader" aria-hidden="true" role="presentation">
        <div class="mkt-pl-stage">
            <div class="mkt-pl-logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Maktaba">
                    <g transform="translate(7, 9) scale(0.196)">
                        <path fill="#0d0d0d" d="M251.83,49.834v166.107H143.855l-12.735-12.444h-10.408l-12.735,12.444H0V49.834h18.321v140.789v14.905l14.049-4.98 c23.612-8.371,46.618-12.44,70.332-12.44c4.713,0,9.725,0.188,14.895,0.559l5.352,0.385v0.427l2.967-0.214l2.967,0.214v-0.427 l5.352-0.385c5.17-0.371,10.182-0.559,14.895-0.559c23.714,0,46.72,4.069,70.332,12.44l14.049,4.98v-14.905V49.834H251.83z M133.479,50.362v127.802c5.261-0.378,10.499-0.587,15.649-0.587c24.821,0,49.12,4.278,73.851,13.046V36.507 c-5.26-0.413-10.493-0.618-15.631-0.618C182.629,35.889,158.398,40.638,133.479,50.362z M28.851,190.623 c24.731-8.768,49.029-13.046,73.851-13.046c5.15,0,10.389,0.209,15.649,0.587V50.362c-24.92-9.725-49.15-14.474-73.869-14.474 c-5.138,0-10.371,0.205-15.631,0.618V190.623z"/>
                    </g>
                </svg>
            </div>
            <div class="mkt-pl-rule"></div>
            <p class="mkt-pl-wordmark">Maktaba</p>
            <div class="mkt-pl-dots"><span></span><span></span><span></span></div>
        </div>
    </div>
  <nav class="navbar">
    <div id="Maktaba"><a href="/home"><h1>Maktaba</h1></a></div>
    <ul class="navrbar-text">
      <li><a href="/home">Home</a></li>
      <li><a href="/browse">Browse</a></li>
      <li><a href="/collection">Collection</a></li>
      <li><a href="/favorites">Favourites</a></li>
    </ul>
    <div class="navbar-icons">
      <a href="/cart"><span class="material-symbols-outlined">shopping_bag</span></a>
      <div class="menu-dropdown-wrapper" id="menuWrapper"><span class="material-symbols-outlined" id="menuBtn">menu</span></div>
      <div class="menu-dropdown" id="menuDropdown">
        <a href="/authors">Authors</a>
        <a href="/settings">Settings</a>
        <a href="/contact" class="contact-placeholder">Contact Us</a>
      </div>
    </div>
  </nav>

  <main class="checkout-container">
    <div class="checkout-breadcrumb">
      <a href="/cart">Shopping cart</a>
      <span>|</span>
      <a href="/checkout">Shipping</a>
      <span>|</span>
      <span class="breadcrumb-active">Payment</span>
    </div>

    <div class="checkout-layout">
      <section class="checkout-form-area">
        <h1 class="checkout-title">Payment method</h1>
        <form id="payment-form" class="payment-form" novalidate>
          <div class="payment-methods" role="radiogroup" aria-label="Payment method">
            <label class="payment-method-card selected">
              <input type="radio" name="paymentMethod" value="Card" checked>
              <span class="material-symbols-outlined">credit_card</span>
              <strong>Credit or debit card</strong>
            </label>
            <label class="payment-method-card">
              <input type="radio" name="paymentMethod" value="Cash on delivery">
              <span class="material-symbols-outlined">payments</span>
              <strong>Cash on delivery</strong>
            </label>
            <label class="payment-method-card">
              <input type="radio" name="paymentMethod" value="Wallet">
              <span class="material-symbols-outlined">account_balance_wallet</span>
              <strong>Digital wallet</strong>
            </label>
          </div>
          <p id="payment-method-error" class="field-error"></p>

          <div id="saved-pay-banner" class="saved-info-banner" style="display:none">
            <span class="material-symbols-outlined">credit_card</span>
            <span class="saved-info-text"></span>
            <button type="button" class="use-saved-btn">Use saved card</button>
          </div>

          <div id="card-payment-fields" class="checkout-section payment-card-fields">
            <p class="checkout-section-label">Card details</p>
            <div class="checkout-row checkout-row-full">
              <div class="checkout-field"><input type="text" id="card-name" class="checkout-input" placeholder="Name on card"></div>
            </div>
            <div class="checkout-row checkout-row-full">
              <div class="checkout-field"><input type="text" id="card-number" class="checkout-input" placeholder="Card number" inputmode="numeric"></div>
            </div>
            <div class="checkout-row checkout-row-three">
              <div class="checkout-field">
                <select id="card-month" class="checkout-input" aria-label="Expiry month">
                  <option value="">Month</option>
                  <option value="01">01</option>
                  <option value="02">02</option>
                  <option value="03">03</option>
                  <option value="04">04</option>
                  <option value="05">05</option>
                  <option value="06">06</option>
                  <option value="07">07</option>
                  <option value="08">08</option>
                  <option value="09">09</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                </select>
              </div>
              <div class="checkout-field">
                <select id="card-year" class="checkout-input" aria-label="Expiry year">
                  <option value="">Year</option>
                  <option value="2026">2026</option>
                  <option value="2027">2027</option>
                  <option value="2028">2028</option>
                  <option value="2029">2029</option>
                  <option value="2030">2030</option>
                  <option value="2031">2031</option>
                  <option value="2032">2032</option>
                  <option value="2033">2033</option>
                  <option value="2034">2034</option>
                  <option value="2035">2035</option>
                  <option value="2036">2036</option>
                </select>
              </div>
              <div class="checkout-field"><input type="text" id="card-cvc" class="checkout-input" placeholder="CVC" inputmode="numeric"></div>
            </div>
          </div>

          <div id="save-pay-wrap" class="save-to-account-wrap" style="display:none;margin-bottom:12px;">
            <label class="save-to-account-label">
              <input type="checkbox" id="save-pay-checkbox">
              Save payment details to my account
            </label>
          </div>
          <button class="checkout-btn" type="submit">Place Order</button>
          <a href="/checkout" class="checkout-back-link">&larr; Back to shipping</a>
        </form>
      </section>

      <aside class="checkout-summary">
        <h3 class="checkout-summary-title">YOUR ORDER</h3>
        <div id="checkout-items-list"></div>
        <div class="checkout-summary-totals">
          <div class="checkout-summary-row"><span>Subtotal</span><span id="checkout-subtotal">&euro;0.00</span></div>
          <div class="checkout-summary-row"><span>Shipping</span><span id="checkout-shipping">&euro;5.00</span></div>
          <div class="checkout-summary-divider"></div>
          <div class="checkout-summary-row checkout-summary-total"><span>TOTAL</span><span id="checkout-total">&euro;0.00</span></div>
        </div>
      </aside>
    </div>
  </main>

  <script src="/data.js"></script>
  <script src="/script.js"></script>
  <script src="/preloader.js"></script>
</body>
</html>
