<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./auth.css">
  <script src="./auth.js" defer></script>
</head>
<body class="admin-dashboard-page book-body">
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <a id="Maktaba" href="../../home.html">Maktaba</a>
      <span>Admin Console</span>
    </div>

    <nav class="admin-nav" aria-label="Admin navigation">
      <a href="./dashboard.html"><span>D</span>Dashboard</a>
      <a class="active" href="./authbooks.html"><span>B</span>Books</a>
      <a href="./totalauth.html"><span>A</span>Authors</a>
    </nav>
  </aside>

  <main class="admin-main admin-list-main">
    <div class="container">
      <div class="header">
        <div>
          <h1>Books</h1>
          <p>6 titles in the collection</p>
        </div>

        <button class="add-btn" id="addbookbtn" onclick="openAddBookModal()">+ Add Book</button>
      </div>

      <input type="text" placeholder="Search books or authors..." class="search">

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Cover</th>
              <th>Title</th>
              <th>Author</th>
              <th>Genre</th>
              <th>Year</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="booksTableBody">
            <tr id="loadingRow">
              <td colspan="8" style="text-align: center; padding: 20px;">Loading books...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add Book Modal -->
  <div id="addBookModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add New Book</h2>
        <button class="modal-close" onclick="closeAddBookModal()">&times;</button>
      </div>
      <form id="addBookForm" class="modal-form">
        <div class="form-row">
          <div class="form-group">
            <label for="bookTitle">Title *</label>
            <input type="text" id="bookTitle" required>
          </div>
          <div class="form-group">
            <label for="bookAuthor">Author *</label>
            <input type="text" id="bookAuthor" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bookGenre">Genre *</label>
            <input type="text" id="bookGenre" required>
          </div>
          <div class="form-group">
            <label for="bookYear">Year *</label>
            <input type="number" id="bookYear" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bookPrice">Price *</label>
            <input type="number" id="bookPrice" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="bookStock">Stock *</label>
            <input type="number" id="bookStock" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bookISBN">ISBN *</label>
            <input type="text" id="bookISBN" required>
          </div>
          <div class="form-group">
            <label for="bookPages">Pages *</label>
            <input type="number" id="bookPages" required>
          </div>
        </div>

        <div class="form-group">
          <label for="bookImage">Image URL *</label>
          <input type="text" id="bookImage" required>
        </div>

        <div class="form-group">
          <label for="bookDescription">Description *</label>
          <textarea id="bookDescription" rows="4" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bookLanguage">Language</label>
            <input type="text" id="bookLanguage" value="English">
          </div>
          <div class="form-group">
            <label for="bookQuote">Quote</label>
            <input type="text" id="bookQuote">
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeAddBookModal()">Cancel</button>
          <button type="submit" class="btn-submit">Add Book</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Dark mode button -->
  <button class="dashboard-dark-mode-btn" onclick="toggleDashboardDarkMode()" aria-label="Toggle dark mode">
    <svg id="dashboard-dark-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <script>
    const API_BASE = 'http://localhost:3000';
    const colorClasses = ['yellow', 'red', 'green', 'brown', 'blue', 'purple'];
    let allBooks = [];

    // ── Load books from MongoDB ──────────────────────────────────
    async function loadBooks() {
      try {
        const res = await fetch(`${API_BASE}/books`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        allBooks = await res.json();
        renderBooks(allBooks);
      } catch (err) {
        console.error('Failed to load books:', err);
        const tbody = document.getElementById('booksTableBody');
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: red; padding: 20px;">Error loading books</td></tr>`;
      }
    }

    // ── Render books in table ────────────────────────────────────
    function renderBooks(books) {
      const tbody = document.getElementById('booksTableBody');
      if (books.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; padding: 20px;">No books found</td></tr>`;
        return;
      }

      tbody.innerHTML = books.map((book, index) => {
        const colorClass = colorClasses[index % colorClasses.length];
        return `
          <tr>
            <td><span class="color-box ${colorClass}"></span></td>
            <td>${book.title}</td>
            <td>${book.author}</td>
            <td><span class="tag">${book.genre}</span></td>
            <td>${book.year}</td>
            <td class="price">$${parseFloat(book.price).toFixed(2)}</td>
            <td>${book.stock || 0}</td>
            <td>
              <button class="edit" onclick="editBook('${book.title}')">Edit</button>
              <button class="delete" onclick="deleteBook('${book.title}')">Delete</button>
            </td>
          </tr>
        `;
      }).join('');

      // Update book count
      document.querySelector('.header p').textContent = `${books.length} title${books.length !== 1 ? 's' : ''} in the collection`;
    }

    // ── Open/Close modal ─────────────────────────────────────────
    function openAddBookModal() {
      document.getElementById('addBookModal').style.display = 'block';
    }

    function closeAddBookModal() {
      document.getElementById('addBookModal').style.display = 'none';
      document.getElementById('addBookForm').reset();
    }

    // ── Add book to database ─────────────────────────────────────
    document.getElementById('addBookForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newBook = {
        title: document.getElementById('bookTitle').value,
        author: document.getElementById('bookAuthor').value,
        genre: document.getElementById('bookGenre').value,
        year: parseInt(document.getElementById('bookYear').value),
        price: parseFloat(document.getElementById('bookPrice').value),
        stock: parseInt(document.getElementById('bookStock').value),
        ISBN: document.getElementById('bookISBN').value,
        pages: parseInt(document.getElementById('bookPages').value),
        image: document.getElementById('bookImage').value,
        description: document.getElementById('bookDescription').value,
        language: document.getElementById('bookLanguage').value,
        quote: document.getElementById('bookQuote').value,
      };

      try {
        const res = await fetch(`${API_BASE}/books`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newBook),
        });

        if (!res.ok) {
          const error = await res.json();
          alert(`Error: ${error.error}`);
          return;
        }

        const savedBook = await res.json();
        allBooks.push(savedBook);
        renderBooks(allBooks);
        closeAddBookModal();
        alert('Book added successfully!');
      } catch (err) {
        console.error('Failed to add book:', err);
        alert('Error adding book');
      }
    });

    // ── Delete book ──────────────────────────────────────────────
    async function deleteBook(title) {
      if (!confirm(`Delete "${title}"?`)) return;

      try {
        const res = await fetch(`${API_BASE}/books/title/${encodeURIComponent(title)}`, {
          method: 'DELETE',
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        allBooks = allBooks.filter(b => b.title !== title);
        renderBooks(allBooks);
        alert('Book deleted successfully!');
      } catch (err) {
        console.error('Failed to delete book:', err);
        alert('Error deleting book');
      }
    }

    // ── Edit book (placeholder) ──────────────────────────────────
    function editBook(title) {
      alert(`Edit functionality for "${title}" - coming soon!`);
    }

    // ── Search books ─────────────────────────────────────────────
    document.querySelector('.search').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allBooks.filter(b => 
        b.title.toLowerCase().includes(query) || 
        b.author.toLowerCase().includes(query)
      );
      renderBooks(filtered);
    });

    // ── Dark mode toggle ─────────────────────────────────────────
    function toggleDashboardDarkMode() {
      const body = document.querySelector('body.admin-dashboard-page');
      const icon = document.getElementById('dashboard-dark-icon');
      
      // Add fade transition
      body.style.opacity = '0.7';
      setTimeout(() => {
        body.classList.toggle('dark-mode');
        body.style.opacity = '1';
      }, 150);

      if (body.classList.contains('dark-mode')) {
        icon.innerHTML = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
      } else {
        icon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
      }

      localStorage.setItem('maktabaDashboardDarkMode', body.classList.contains('dark-mode'));
    }

    // Load books and restore dark mode on page load
    document.addEventListener('DOMContentLoaded', () => {
      loadBooks();
      if (localStorage.getItem('maktabaDashboardDarkMode') === 'true') {
        toggleDashboardDarkMode();
      }
    });
  </script>
</body>
</html>
