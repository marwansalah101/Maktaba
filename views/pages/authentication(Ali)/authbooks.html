<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pages/authentication(Ali)/auth.css">
  <script src="/pages/authentication(Ali)/dashboard.js" defer></script>
</head>
<body class="admin-dashboard-page book-body">
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <a id="Maktaba" href="/home">Maktaba</a>
      <span>Admin Console</span>
    </div>

    <nav class="admin-nav" aria-label="Admin navigation">
      <a href="/dashboard"><span>D</span>Dashboard</a>
      <a class="active" href="/authbooks"><span>B</span>Books</a>
      <a href="/totalauth"><span>A</span>Authors</a>
    </nav>
  </aside>

  <main class="admin-main admin-list-main">
    <div class="container">
      <div class="header">
        <div>
          <h1>Books</h1>
          <p id="books-count">Loading…</p>
        </div>

        <button class="add-btn" id="addbookbtn" onclick="openAddBookModal()">+ Add Book</button>
      </div>

      <input type="text" placeholder="Search books or authors..." class="search">

      <div class="table-container">
        <table id="booksTable">
          <thead>
            <tr>
              <th>Cover</th>
              <th>Title</th>
              <th>Author</th>
              <th>Genre</th>
              <th>Year</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="books-tbody">
            <tr><td colspan="8" style="text-align:center;padding:24px;color:#888;">Loading books…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add Book Modal -->
  <div id="addBookModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add New Book</h2>
        <button class="modal-close" onclick="closeAddBookModal()">&times;</button>
      </div>
      <form id="addBookForm" class="modal-form">
        <div class="form-row">
          <div class="form-group">
            <label for="bookTitle">Title *</label>
            <input type="text" id="bookTitle" required>
          </div>
          <div class="form-group">
            <label for="bookAuthor">Author *</label>
            <input type="text" id="bookAuthor" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bookGenre">Genre *</label>
            <input type="text" id="bookGenre" required>
          </div>
          <div class="form-group">
            <label for="bookYear">Year *</label>
            <input type="number" id="bookYear" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bookPrice">Price *</label>
            <input type="number" id="bookPrice" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="bookStock">Stock *</label>
            <input type="number" id="bookStock" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bookSalePercent">Sale Percent</label>
            <input type="number" id="bookSalePercent" min="0" max="100" step="1" value="0">
          </div>
          <div class="form-group">
            <label for="bookSalePrice">Sale Price</label>
            <input type="number" id="bookSalePrice" min="0" step="0.01" value="0">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bookISBN">ISBN *</label>
            <input type="text" id="bookISBN" required>
          </div>
          <div class="form-group">
            <label for="bookPages">Pages *</label>
            <input type="number" id="bookPages" required>
          </div>
        </div>

        <div class="form-group">
          <label for="bookImage">Image URL *</label>
          <input type="text" id="bookImage" required>
        </div>

        <div class="form-group">
          <label for="bookDescription">Description *</label>
          <textarea id="bookDescription" rows="4" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bookLanguage">Language</label>
            <input type="text" id="bookLanguage" value="English">
          </div>
          <div class="form-group">
            <label for="bookQuote">Quote</label>
            <input type="text" id="bookQuote">
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeAddBookModal()">Cancel</button>
          <button type="submit" class="btn-submit">Add Book</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
