<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authors</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pages/authentication(Ali)/auth.css">
  <script src="/pages/authentication(Ali)/dashboard.js" defer></script>
</head>
<body class="admin-dashboard-page authors-body">
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <a id="Maktaba" href="/home">Maktaba</a>
      <span>Admin Console</span>
    </div>

    <nav class="admin-nav" aria-label="Admin navigation">
      <a href="/dashboard"><span>D</span>Dashboard</a>
      <a href="/authbooks"><span>B</span>Books</a>
      <a class="active" href="/totalauth"><span>A</span>Authors</a>
    </nav>
  </aside>

  <main class="admin-main admin-list-main">
    <div class="container">
      <div class="header">
        <div>
          <h1>Authors</h1>
          <p id="authors-count">Loading…</p>
        </div>

        <button class="add-btn" onclick="openAddAuthorModal()">+ Add Author</button>
      </div>

      <input type="text" placeholder="Search authors..." class="search">

      <div class="cards" id="authors-cards">
        <p style="padding:24px;color:#888;">Loading authors…</p>
      </div>
    </div>

    <!-- Add Author Modal -->
    <div id="addAuthorModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add New Author</h2>
          <button class="modal-close" onclick="closeAddAuthorModal()">&times;</button>
        </div>
        <form id="addAuthorForm" class="modal-form">
          <div class="form-row">
            <div class="form-group">
              <label for="authorName">Name *</label>
              <input type="text" id="authorName" required>
            </div>
            <div class="form-group">
              <label for="authorSlug">Slug *</label>
              <input type="text" id="authorSlug" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="authorStats">Stats</label>
              <input type="text" id="authorStats" placeholder="63 Novels · 350M Copies Sold">
            </div>
            <div class="form-group">
              <label for="authorAboutTitle">About Title</label>
              <input type="text" id="authorAboutTitle" placeholder="Master of Horror">
            </div>
          </div>

          <div class="form-group">
            <label for="authorAboutText">About Text</label>
            <textarea id="authorAboutText" rows="4" placeholder="Stephen King is an American author of horror and supernatural fiction.…"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="authorBannerImg">Banner Image URL *</label>
              <input type="text" id="authorBannerImg" placeholder="resources/Authors/stephen-king.jpg" required>
            </div>
            <div class="form-group">
              <label for="authorProfileImgFile">Profile Image *</label>
              <input type="file" id="authorProfileImgFile" accept="image/*" required>
            </div>
          </div>

          <div class="form-group">
            <label for="authorBooks">Books</label>
            <input type="text" id="authorBooks" placeholder="Comma-separated Book IDs">
            <small>Use book document IDs to populate references, or leave blank.</small>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-cancel" onclick="closeAddAuthorModal()">Cancel</button>
            <button type="submit" class="btn-submit">Add Author</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
