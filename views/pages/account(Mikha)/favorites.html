<script src="/script.js"></script>
<script>
(function () {
    function updateFavStats() {
        var items = document.querySelectorAll('.favorites-list .favorite-item');
        var count = items.length;
        var total = 0;
        items.forEach(function (item) {
            var btn = item.querySelector('.favorite-bag-btn');
            if (btn) total += parseFloat(btn.dataset.price) || 0;
        });
        var countEl = document.getElementById('fav-count');
        var totalEl = document.getElementById('fav-total');
        var addAllBtn = document.getElementById('favAddAllBtn');
        if (countEl) countEl.textContent = count === 1 ? '1 book' : count + ' books';
        if (totalEl) totalEl.textContent = count > 0 ? total.toFixed(2) + ' L.E' : '';
        if (addAllBtn) addAllBtn.disabled = count === 0;
    }

    var list = document.querySelector('.favorites-list');
    if (list) {
        new MutationObserver(updateFavStats).observe(list, { childList: true });
    }

    document.getElementById('favAddAllBtn').addEventListener('click', function () {
        var items = document.querySelectorAll('.favorites-list .favorite-item');
        var added = 0;
        items.forEach(function (item) {
            var btn = item.querySelector('.favorite-bag-btn');
            if (btn && typeof addBookToCart === 'function') {
                addBookToCart({
                    title: btn.dataset.title,
                    author: btn.dataset.author,
                    price: btn.dataset.price,
                    originalPrice: btn.dataset.originalPrice,
                    salePrice: btn.dataset.salePrice,
                    salePercent: btn.dataset.salePercent,
                    image: btn.dataset.image,
                    qty: 1
                });
                added++;
            }
        });
        if (added > 0) {
            if (typeof window.mkToast === 'function') {
                window.mkToast(added + (added === 1 ? ' book' : ' books') + ' added to cart');
            }
            if (typeof window.mkUpdateCartBadge === 'function') {
                window.mkUpdateCartBadge();
            }
        }
    });
}());
</script>
