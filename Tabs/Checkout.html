<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - Maktaba</title>

  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
     <link rel="icon" type="image/svg + xml" sizes="64x64" href="../resources/asset/Logo.svg" />
</head>
<style>
.checkout-page {
    background-color: #f5f0e8;
    font-family: 'Space Grotesk', sans-serif;
    color: #2c1a1a;
    min-height: 100vh;
   /* padding: 28px 20px 40px;*/

    margin: 0;
}

.checkout-container {
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 20px;
}

.checkout-breadcrumb {
    font-size: 13px;
    color: #8f877f;
    margin-bottom: 24px;
    margin-top:40px;
}

.checkout-breadcrumb a {
    color: #8f877f;
    text-decoration: none;
}

.breadcrumb-active {
    color: #2c1a1a;
    font-weight: 600;
}

.checkout-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 350px;
    gap: 56px;
    align-items: start;
}

.checkout-title {
    font-family: 'Playfair Display', serif;
    font-size: 44px;
    font-weight: 500;
    color: #2c1a1a;
    margin-bottom: 32px;
}

.checkout-section {
    margin-bottom: 28px;
}

.checkout-section-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #59443d;
    margin-bottom: 14px;
}

.checkout-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
}

.checkout-row-full {
    grid-template-columns: 1fr;
}

.checkout-input {
    width: 100%;
    padding: 14px 16px;
    background: transparent;
    border: 1px solid #d4cabd;
    border-radius: 7px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    color: #2c1a1a;
    outline: none;
    box-sizing: border-box;
}

.checkout-input::placeholder {
    color: #aaa095;
}

.checkout-input:focus {
    border-color: #6b2d2d;
    box-shadow: 0 0 0 3px rgba(107, 45, 45, 0.08);
}

.checkout-btn {
    width: 100%;
    padding: 16px;
    background-color: #4a1a1a;
    color: #f5f0e8;
    border: none;
    border-radius: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 8px;
    transition: background-color 0.2s ease, transform 0.2s ease;
    display: block;
}

.checkout-btn:hover {
    background-color: #6b2d2d;
    transform: translateY(-1px);
}

.checkout-back-link {
    display: inline-block;
    margin-top: 18px;
    font-size: 13px;
    color: #8f877f;
    text-decoration: none;
}

.checkout-summary {
    background: #fbf9f7;
    border: 1px solid #e3d9ce;
    border-radius: 12px;
    padding: 22px 20px;
}

.checkout-summary-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 600;
    color: #4A2C2A;
    margin-bottom: 18px;
    text-transform: uppercase;
}

.checkout-order-item {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    gap: 12px;
    align-items: start;
    padding: 14px 0;
    border-bottom: 1px solid #eee3d8;
}

.checkout-book-cover {
    width: 42px;
    height: 60px;
    object-fit: cover;
    border-radius: 3px;
    background: #d4c4b0;
}

.checkout-item-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.checkout-item-title {
    font-size: 13px;
    color: #4A2C2A;
    line-height: 1.35;
}

.checkout-item-qty {
    font-size: 11px;
    color: #8f877f;
    text-transform: uppercase;
}

.checkout-item-price {
    font-size: 13px;
    color: #4A2C2A;
    font-weight: 500;
    white-space: nowrap;
}

.checkout-summary-totals {
    margin-top: 18px;
}

.checkout-summary-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: #7a6b61;
    margin-bottom: 10px;
}

.checkout-summary-divider {
    height: 1px;
    background: #e4d9cd;
    margin: 14px 0;
}

.checkout-summary-total {
    font-size: 15px;
    font-weight: 700;
    color: #2c1a1a;
}

@media (max-width: 900px) {
    .checkout-layout {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {
    .checkout-container {
        padding: 0 10px;
    }

    .checkout-title {
        font-size: 34px;
    }

    .checkout-row {
        grid-template-columns: 1fr;
    }
}
</style>
<body class="checkout-page">

  <div class="checkout-container">
    <div class="checkout-breadcrumb">
      <a href="AddtoCart.html">Shopping cart</a>
      <span>|</span>
      <span class="breadcrumb-active">Checkout</span>
    </div>

    <div class="checkout-layout">

      <!-- LEFT -->
      <section class="checkout-form-area">
        <h1 class="checkout-title">Checkout</h1>

        <div class="checkout-section">
          <p class="checkout-section-label">Contact Information</p>

          <div class="checkout-row">
            <input type="text" id="co-fname" class="checkout-input" placeholder="First name">
            <input type="text" id="co-lname" class="checkout-input" placeholder="Last name">
          </div>

          <div class="checkout-row checkout-row-full">
            <input type="email" id="co-email" class="checkout-input" placeholder="E-mail">
          </div>
        </div>

        <div class="checkout-section">
          <p class="checkout-section-label">Shipping Address</p>

          <div class="checkout-row">
            <input type="text" id="co-street" class="checkout-input" placeholder="Street">
            <input type="text" id="co-number" class="checkout-input" placeholder="Number">
          </div>

          <div class="checkout-row">
            <input type="text" id="co-postcode" class="checkout-input" placeholder="Postcode">
            <input type="text" id="co-place" class="checkout-input" placeholder="Place">
          </div>

          <div class="checkout-row checkout-row-full">
            <input type="text" id="co-country" class="checkout-input" placeholder="Country">
          </div>
        </div>

        <button id="checkoutSubmitBtn" class="checkout-btn">Check Out</button>

        <a href="AddtoCart.html" class="checkout-back-link">← Back to cart</a>
      </section>

      <!-- RIGHT -->
      <aside class="checkout-summary">
        <h3 class="checkout-summary-title">YOUR ORDER</h3>

        <div id="checkout-items-list"></div>

        <div class="checkout-summary-totals">
          <div class="checkout-summary-row">
            <span>Subtotal</span>
            <span id="checkout-subtotal">€0.00</span>
          </div>

          <div class="checkout-summary-row">
            <span>Shipping</span>
            <span>€5.00</span>
          </div>

          <div class="checkout-summary-divider"></div>

          <div class="checkout-summary-row checkout-summary-total">
            <span>TOTAL</span>
            <span id="checkout-total">€0.00</span>
          </div>
        </div>
      </aside>

    </div>
  </div>

  <script src="../data.js"></script>
  <script src="../script.js"></script>
</body>
</html>
