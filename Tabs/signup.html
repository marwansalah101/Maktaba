<!DOCTYPE html>
<html>
<head>
    <title>Maktaba - Sign Up</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../script.js"></script>
</head>

<body>

<div class="main-container">

    <div class="form-side">

<a class="logo" href=http://127.0.0.1:5500/Tabs/Home.html>M A K T A B A</a>

        <p class="desc">
            Create your MAKTABA account and start building your personal bookshelf.
        </p>

        <!-- Name -->
        <div class="input-group">
            <label class="labels" for="name"><b>Full Name</b></label><br><br>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <!-- Email -->
        <div class="input-group">
            <label class="labels" for="email"><b>Your email</b></label><br><br>
            <input type="text" id="email" placeholder="Enter your email">
        </div>

        <!-- Password -->
        <div class="input-group">
            <label class="labels" for="password"><b>Password</b></label><br><br>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <!-- Confirm Password -->
        <div class="input-group">
            <label class="labels" for="confirm"><b>Confirm Password</b></label><br><br>
            <input type="password" id="confirm" placeholder="Confirm password">
        </div>

        <!-- Button -->
        <button class="login-btn">Create Account</button>

        <p class="continue">──────────── or continue with ────────────</p>

        <!-- Social -->
        <div class="social-buttons">

            <button class="google">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20">
                Google
            </button>

            <button class="facebook">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" width="20">
                Facebook
            </button>

        </div>

        <br>

        <p class="noaccp">
            Already have an account?
            <a class="link" href="signin.html"> Sign in</a>
        </p>

    </div>

    <div class="image-side"></div>

</div>

</body>
</html>
