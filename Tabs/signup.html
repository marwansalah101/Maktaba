<!DOCTYPE html>
<html>
<head>
    <title>Maktaba - Sign Up</title>
<link rel="stylesheet" href="../styles.css">
<script src="../script.js"></script><body class="signup-body">

</head>
<body class="signup-body">

<div class="signup-container">

    <div class="signup-form-side">

        <h1 class="signup-logo">M A K T A B A</h1>


        <h2 class="signup-heading">Create account</h2>

        <p class="signup-desc">Join our community of readers.</p>

        <!-- Form -->
        <form onsubmit="return signupUser()">

            <div class="signup-field">
                <label class="signup-labels">FULL NAME</label>
                <input class="signup-input" type="text" id="signup-name" placeholder="Enter your name">
            </div>

            <div class="signup-field">
                <label class="signup-labels">E-MAIL</label>
                <input class="signup-input" type="email" id="signup-email" placeholder="Enter your e-mail">
            </div>


            <div class="signup-field">
                <label class="signup-labels">PASSWORD</label>
                <div class="signup-password-wrapper">
                    <input class="signup-input" type="password" id="signup-password" placeholder="********">
                    <span onclick="toggleSignupPassword()">👁</span>
                </div>
            </div>

            <div class="signup-field">
                <label class="signup-labels">CONFIRM PASSWORD</label>
                <div class="signup-password-wrapper">
                    <input class="signup-input" type="password" id="signup-confirm" placeholder="********">
                    <span onclick="toggleSignupConfirm()">👁</span>
                </div>
            </div>
<br>
<p class="requirments">• Password must include atleast 6 characters with uppercase letter and a digit</p>


            <button class="signup-btn" type="submit">Get started</button>

            <p id="signup-message" class="signup-form-message"></p>

            <p class="signup-accs">
                Already have an account?
                <a href="signin.html">Log in</a>
            </p>

        </form>
    </div>
</div>

<script src="signup.js"></script>
</body>
</html>
