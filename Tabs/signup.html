<!DOCTYPE html>
<html>
<head>
<title>Edupage Sign Up</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:serif;

    background: linear-gradient(to right,
    #5a4638 0%,
    #8a6b55 30%,
    blanchedalmond 50%,
    #8a6b55 70%,
    #5a4638 100%);
}

/* Inputs */
input{
    width:340px;
    padding:15px;
    border:1px solid #ccc;
    border-radius:30px;
    background-color:white;
    font-size:16px;
    outline:none;
    transition:0.3s;
}

/* Focus effect */
input:focus{
    border:2px solid #504339;
}

/* Form container */
.form-box{
    display:flex;
    flex-direction:column;
    gap:18px;
    align-items:center;
}

</style>

</head>

<body>

<!-- Header -->
<a href="../Tabs/Home.html"
   style="position:absolute;
          top:35px;
          left:50%;
          transform:translateX(-50%);
          text-decoration:none;
          font-size:50px;
          color:#504339;
          font-weight:bold;">
   M A K T B A
</a>

<div class="form-box">

    <!-- Full Name -->
    <input type="text" placeholder="Full Name">

    <!-- Email -->
    <input type="email" placeholder="Email / Username">

    <!-- Password -->
    <input type="password" id="password" placeholder="Password">

    <!-- Confirm Password -->
    <input type="password" id="confirmPassword" placeholder="Confirm Password">


    <!-- Age -->
    <div style="display:flex; gap:10px;">
        <select style="padding:10px;border-radius:20px;border:1px solid #ccc;">
            <option>Day</option>
            <option>1</option><option>2</option><option>3</option>
            <option>4</option><option>5</option><option>6</option>
            <option>7</option><option>8</option><option>9</option>
            <option>10</option><option>11</option><option>12</option>
            <option>13</option><option>14</option><option>15</option>
            <option>16</option><option>17</option><option>18</option>
            <option>19</option><option>20</option><option>21</option>
            <option>22</option><option>23</option><option>24</option>
            <option>25</option><option>26</option><option>27</option>
            <option>28</option><option>29</option><option>30</option>
            <option>31</option>
        </select>

        <select style="padding:10px;border-radius:20px;border:1px solid #ccc;">
            <option>Month</option>
            <option>January</option><option>February</option>
            <option>March</option><option>April</option>
            <option>May</option><option>June</option>
            <option>July</option><option>August</option>
            <option>September</option><option>October</option>
            <option>November</option><option>December</option>
        </select>

        <select style="padding:10px;border-radius:20px;border:1px solid #ccc;">
            <option>Year</option>
            <option>2026</option><option>2025</option>
            <option>2024</option><option>2023</option>
            <option>2022</option><option>2021</option>
        </select>
    </div>


    <!-- Login Button -->
    <button onclick="checkPassword()"
            style="background-color:#504339;
                   color:#d4ae92;
                   width:280px;
                   padding:12px;
                   border-radius:30px;
                   border:none;
                   font-size:16px;
                   cursor:pointer;">
        Log-in
    </button>


    <!-- Google Button -->
    <button style="background-color:white;
                   color:black;
                   width:340px;
                   padding:12px;
                   border-radius:30px;
                   border:1px solid #ccc;
                   font-size:16px;
                   display:flex;
                   align-items:center;
                   justify-content:center;
                   gap:10px;
                   cursor:pointer;">
        <img src="https://img.icons8.com/color/48/google-logo.png" width="20">
        Sign in with Google
    </button>


    <!-- Apple Button -->
    <button style="background-color:black;
                   color:white;
                   width:340px;
                   padding:12px;
                   border-radius:30px;
                   border:none;
                   font-size:16px;
                   display:flex;
                   align-items:center;
                   justify-content:center;
                   gap:10px;
                   cursor:pointer;">
        <img src="https://cdn.simpleicons.org/apple/ffffff" width="20">
        Sign in with Apple
    </button>

</div>


<script>
function checkPassword() {

    var pass = document.getElementById("password").value;
    var confirmPass = document.getElementById("confirmPassword").value;

    if (pass === confirmPass && pass !== "") {
        alert("Login Successful ✅");
    } else {
        alert("Passwords do NOT match ❌");
    }   

}
</script>

</body>
</html>
