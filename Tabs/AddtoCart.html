<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart - Maktaba</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Jost:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="../../styles.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #F0EDE5;
      font-family: 'Jost', sans-serif;
      color: #312F2C;
      min-height: 100vh;
    }

    /* ── PAGE LAYOUT ── */
    .cart-page-wrapper {
      max-width: 980px;
      margin: 0 auto;
      padding: 100px 32px 80px;
    }

    .cart-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #a08f83;
      font-size: 14px;
      margin-bottom: 18px;
      transition: color 0.2s;
    }
    .cart-back-link:hover { color: #312F2C; }

    /* ── HEADER ── */
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid #d9d0c4;
      padding-bottom: 16px;
      margin-bottom: 0;
    }

    .cart-header-left {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .cart-header-left h1 {
      font-family: 'Times New Roman', serif;
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #312F2C;
    }

    .cart-header-left span {
      font-size: 14px;
      color: #605c55b5;
      font-weight: 400;
    }

    .cart-header-total {
      font-size: 14px;
      color: #605c55b5;
    }

    .cart-header-total strong {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 700;
      color: #312F2C;
      margin-left: 8px;
    }

    /* ── CART ITEM ── */
    .cart-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 28px 0;
      border-bottom: 1px solid #d9d0c4;
      position: relative;
    }

    .cart-item-img {
      width: 56px;
      height: 84px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
      background: transparent;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-category {
      font-size: 12px;
      letter-spacing: 1.6px;
      color: #605c55b5;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .cart-item-info h3 {
      font-family: 'Times New Roman', serif;
      font-size: 31px;
      font-weight: 500;
      color: #312F2C;
      margin-bottom: 4px;
    }

    .cart-item-info .author {
      font-size: 17px;
      color: #605c55b5;
      margin-bottom: 14px;
    }

    /* qty controls */
    .qty-row {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .qty-label {
      font-size: 13px;
      color: #605c55b5;
      margin-right: 12px;
    }

    .qty-btn {
      width: 30px;
      height: 30px;
      background: transparent;
      border: 1px solid #d9d0c4;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      color: #312F2C;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      line-height: 1;
    }
    .qty-btn:hover { background: #e8e4de; }

    .qty-value {
      width: 36px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: #312F2C;
    }

    /* price */
    .cart-item-price {
      font-family: 'Playfair Display', serif;
      font-size: 30px;
      font-weight: 700;
      color: #312F2C;
      min-width: 100px;
      text-align: right;
    }

    /* remove btn */
    .cart-remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 16px;
      padding: 4px 8px;
      line-height: 1;
      transition: color 0.2s;
    }
    .cart-remove-btn:hover { color: #312F2C; }

    /* empty state */
    .cart-empty {
      text-align: center;
      color: #a08f83;
      padding: 80px 0;
      font-size: 16px;
      display: none;
    }

    /* ── BOTTOM ROW ── */
    .cart-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 32px;
    }

    .checkout-btn {
      background: #312F2C;
      color: #F0EDE5;
      border: none;
      padding: 16px 40px;
      font-family: 'Jost', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .checkout-btn:hover { background: #4a4744; }
    .checkout-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .cart-page-wrapper { padding: 30px 18px 60px; }
      .cart-header-left h1 { font-size: 46px; }
      .cart-item { flex-wrap: wrap; }
      .cart-item-info h3 { font-size: 24px; }
      .cart-item-price { font-size: 24px; }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div id="Maktaba">
      <a href="../../home.html">
        <h1>Maktaba</h1>
      </a>
    </div>
    <ul class="navrbar-text">
      <li><a href="../../home.html">Home</a></li>
      <li><a href="../catalog(Marwan)/genres.html">Browse</a></li>
      <li><a href="../catalog(Marwan)/collection.html">Collection</a></li>
      <li><a href="../account(Mikha)/favorites.html">Favourites</a></li>
    </ul>
    <div class="navbar-icons">
      <a href="../checkout(Rojeh)/add-to-cart.html">
        <span class="material-symbols-outlined">shopping_bag</span>
      </a>
      <div class="menu-dropdown-wrapper" id="menuWrapper">
        <span class="material-symbols-outlined" id="menuBtn">menu</span>
      </div>
      <div class="menu-dropdown" id="menuDropdown">
        <a href="../home(fares)/AllAuthors.html">Authors</a>
        <a href="../authentication(Ali)/signup.html">Profile</a>
        <a href="../account(Mikha)/settings.html">Settings</a>
        <a href="../account(Mikha)/contact-us.html">Contact Us</a>
      </div>
    </div>
  </nav>

  <!-- PAGE -->
  <div class="cart-page-wrapper">

    <a href="../account(Mikha)/favorites.html" class="cart-back-link">
      <span class="material-symbols-outlined">arrow_back</span>
      Back to Browsing
    </a>

    <!-- HEADER -->
    <div class="cart-header">
      <div class="cart-header-left">
        <h1>Your Cart</h1>
        <span id="cart-count">0 Items</span>
      </div>
      <div class="cart-header-total">
        Total <strong id="header-total">€0.00</strong>
      </div>
    </div>

    <!-- ITEMS -->
    <div id="cart-items-container"></div>

    <div class="cart-empty" id="cart-empty-msg">
      Your cart is empty.<br>
      <a href="../account(Mikha)/favorites.html" style="color:#312F2C; margin-top:12px; display:inline-block; text-decoration:underline;">Go to Favourites →</a>
    </div>

    <!-- BOTTOM -->
    <div class="cart-bottom">
      <a href="../account(Mikha)/favorites.html" class="cart-back-link" style="margin-bottom:0;">
        <span class="material-symbols-outlined">arrow_back</span>
        Continue shopping
      </a>
      <button class="checkout-btn" id="checkout-btn" onclick="window.location.href='checkout.html'">
        Proceed to checkout
      </button>
    </div>

  </div>

  <script>
    const SHIPPING = 5;

    function getSessionId() {
      let sid = localStorage.getItem('cartSessionId');
      if (!sid) {
        sid = crypto.randomUUID();
        localStorage.setItem('cartSessionId', sid);
      }
      return sid;
    }

    async function getCart() {
      try {
        const res = await fetch('/api/cart', {
          headers: { 'x-session-id': getSessionId() }
        });
        if (!res.ok) return [];
        const data = await res.json();
        return data.items || [];
      } catch {
        return [];
      }
    }

    async function renderCart() {
      const cart      = await getCart();
      const container = document.getElementById('cart-items-container');
      const emptyMsg  = document.getElementById('cart-empty-msg');
      const checkoutBtn = document.getElementById('checkout-btn');
      const cartCount   = document.getElementById('cart-count');
      const headerTotal = document.getElementById('header-total');

      container.innerHTML = '';

      if (cart.length === 0) {
        emptyMsg.style.display  = 'block';
        checkoutBtn.disabled    = true;
        cartCount.textContent   = '0 Items';
        headerTotal.textContent = '€0.00';
        return;
      }

      emptyMsg.style.display = 'none';
      checkoutBtn.disabled   = false;

      let subtotal = 0;
      let totalQty = 0;

      cart.forEach(item => {
        const price = parseFloat(item.price);
        subtotal += price * item.qty;
        totalQty += item.qty;

        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <img class="cart-item-img" src="${item.image}" alt="${item.title}">
          <div class="cart-item-info">
            <p class="cart-item-category">${item.genre || ''}</p>
            <h3>${item.title}</h3>
            <p class="author">${item.author}</p>
            <div class="qty-row">
              <span class="qty-label">Quantity</span>
              <button class="qty-btn" onclick="changeQty('${item.bookId}', ${item.qty - 1})">-</button>
              <span class="qty-value">${item.qty}</span>
              <button class="qty-btn" onclick="changeQty('${item.bookId}', ${item.qty + 1})">+</button>
            </div>
          </div>
          <div class="cart-item-price">€${(price * item.qty).toFixed(2)}</div>
          <button class="cart-remove-btn" onclick="removeItem('${item.bookId}')">✕</button>
        `;
        container.appendChild(div);
      });

      cartCount.textContent   = `${totalQty} Item${totalQty !== 1 ? 's' : ''}`;
      headerTotal.textContent = `€${(subtotal + SHIPPING).toFixed(2)}`;
    }

    async function changeQty(bookId, newQty) {
      await fetch(`/api/cart/update/${bookId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'x-session-id': getSessionId()
        },
        body: JSON.stringify({ qty: newQty })
      });
      renderCart();
    }

    async function removeItem(bookId) {
      await fetch(`/api/cart/remove/${bookId}`, {
        method: 'DELETE',
        headers: { 'x-session-id': getSessionId() }
      });
      renderCart();
    }

    async function addToCart(bookId, title, author, image, price, genre) {
      await fetch('/api/cart/add', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-session-id': getSessionId()
        },
        body: JSON.stringify({ bookId, title, author, image, price, genre })
      });
      renderCart();
    }

    renderCart();
  </script>

</body>
</html>
