<body>
    <nav class="navbarb">
        <span id="Maktabab">
            <a href="#Maktaba" style="margin-left: 20px;">Maktaba</a>
        </span>
        <ul style="align-items: right; justify-content: flex-end; gap: 20px;">
            <li><a href="Home.html"><img src="homeIcon.png" alt="Home Icon" style="width: 20px; height: 20px;"></a></li>
            <li><a href="#"><img src="favouriteIcon.png" alt="Favorites Icon" style="width: 20px; height: 20px;"></a>

        </ul>

    <!-- Hero Banner -->

        <img src="33.jpg" alt="Browse Banner" class="hero-img">

        </div>

    <!-- Search below hero -->
    <div class="hero-search-section">

                    <img src="SearchIcon.png" alt="Search Icon" style="width: 15px; height: 15px; margin-right: 5px;">
                    <input class="search-input" type="search" placeholder="Search for books...">
                </div>
                <button class="search-button" type="submit">Search</button>
                    <div class="search-filters">
                        <button class="search-filters-button"> <img src="filters.png" alt="filters" style="width: 40px; height: 40px;"></button>
                        <div class="search-filters-content">
                            <a href="#">Fiction</a>
                            <a href="#">Mystery & Thriller</a>
                            <a href="#">Sci fi</a>
                            <a href="#">Fantasy</a>
                            <a href="#">Romance</a>
                            <a href="#">Non-fiction</a>
                            <a href="#">Biographies</a>
                            <a href="#">Self-help</a>
                            <a href="#">Religious books</a>
                            <a href="#">Horror</a>
                        </div>
                    </div>
                    <button class="search-criteria" type="search">fiction</button>
                    <button class="search-criteria" type="search">Sci-fi</button>
            </div>
        </form>
    </div>

    <!-- Content below hero -->
    <div class="browse-content">
        <div class="pictures-grid">
            <!-- book cards go here -->
        </div>
