<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>

<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="./account.css">
 <link rel="icon" type="image/svg + xml" sizes="64x64" href="../../resources/asset/Logo.svg">

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Sans&amp;family=Playfair+Display:wght@400;700&amp;display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'DM Sans',sans-serif;
}

/* PAGE LAYOUT */

.settings-page{
max-width:960px;
margin:auto;
padding:60px 24px;
display:grid;
grid-template-columns:220px 1fr;
gap:60px;
}

.settings-main{
border-left:.5px solid #e0ddd8;
padding-left:48px;
}

.nav-item{
display:block;
padding:10px;
border:none;
background:none;
cursor:pointer;
}

.nav-item.active{
background:#312F2C;
color:white;
}

.tab-panel{display:none;}
.tab-panel.active{display:block;}

.page-title{
font-family:'Playfair Display',serif;
font-size:36px;
margin-bottom:40px;
}

/* ACCOUNT */

.field-row{
display:flex;
align-items:center;
padding:16px 0;
border-bottom:.5px solid #e0ddd8;
gap:16px;
}

.field-label{
width:140px;
font-size:12px;
color:#aaa;
}

.field-value input,
.field-value select{
border:none;
background:none;
font-size:14px;
width:100%;
outline:none;
}

.save-btn{
margin-top:30px;
background:#312F2C;
color:white;
border:none;
padding:12px 40px;
cursor:pointer;
}

/* AVATAR */

.avatar-row{
display:flex;
gap:20px;
padding:20px 0;
border-bottom:.5px solid #e0ddd8;
}

.avatar-circle{
width:64px;
height:64px;
border-radius:50%;
background:#e0ddd8;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.avatar-circle img{
width:100%;
height:100%;
object-fit:cover;
}

/* PRIVACY STYLES */

.privacy-card{
border:.5px solid #e0ddd8;
padding:24px;
margin-bottom:28px;
}

.privacy-card-title{
font-family:'Playfair Display',serif;
font-size:20px;
margin-bottom:6px;
}

.privacy-card-sub{
font-size:13px;
color:#777;
margin-bottom:20px;
}

.privacy-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 0;
border-bottom:.5px solid #e0ddd8;
gap:20px;
}

.border-none{border-bottom:none;}

.privacy-row-info{
display:flex;
flex-direction:column;
gap:4px;
}

.privacy-btn{
background:#312F2C;
color:white;
border:none;
padding:8px 18px;
cursor:pointer;
}

.privacy-btn.danger{
background:#c0392b;
}

.verified-badge{
color:green;
font-size:12px;
}

.privacy-input{
border:1px solid #ddd;
padding:8px;
width:220px;
}

#toast{
position:fixed;
bottom:30px;
right:30px;
background:#312F2C;
color:white;
padding:14px 26px;
opacity:0;
transition:.3s;
}

#toast.show{opacity:1;}

</style>
</head>

<body>

<div class="settings-page">

<!-- SIDEBAR -->
<aside>
<h2>Settings</h2>

<button class="nav-item active" onclick="showTab('account',this)">Account</button>
<button class="nav-item" onclick="showTab('privacy',this)">Privacy</button>

</aside>

<!-- MAIN -->
<main class="settings-main">

<!-- ACCOUNT TAB -->
<div id="tab-account" class="tab-panel active">

<h1 class="page-title">Account Settings</h1>

<div class="avatar-row">
<div class="avatar-circle" id="avatarEl">WA</div>

<div>
<button onclick="avatarInput.click()">Upload</button>
<button onclick="removeAvatar()">Remove</button>
<input type="file" id="avatarInput" hidden="" accept="image/*" onchange="previewAvatar(event)">
</div>
</div>

<div class="field-row">
<span class="field-label">Name</span>
<div class="field-value">
<input type="text" value="Wade Armstrong">
</div>
</div>

<div class="field-row">
<span class="field-label">Email</span>
<div class="field-value">
<input type="email" value="wade@email.com">
</div>
</div>

<div class="field-row">
<span class="field-label">Password</span>
<div class="field-value">
<input type="password" value="password123">
</div>
</div>

<button class="save-btn" onclick="showToast()">Save Changes</button>

</div>

<!-- PRIVACY TAB -->
<div id="tab-privacy" class="tab-panel">

<h1 class="page-title">Privacy</h1>

<div class="privacy-card">

<h2 class="privacy-card-title">Account Details</h2>
<p class="privacy-card-sub">
Manage your account security settings
</p>

<div class="privacy-row">
<div class="privacy-row-info">
<span>Verify Email Address</span>
<span>Confirm your credentials</span>
</div>
<span class="verified-badge">Verified</span>
</div>

<div class="privacy-row">
<div class="privacy-row-info">
<span>Update Password</span>
<span>Protect your account</span>
</div>
<button class="privacy-btn">Change Password</button>
</div>

</div>

<div class="privacy-card">

<h2 class="privacy-card-title">Recovery Settings</h2>

<div class="privacy-row">
<div class="privacy-row-info">
<span>Recovery Email</span>
</div>
<input class="privacy-input" placeholder="your@email.com">
</div>

<div class="privacy-row">
<div class="privacy-row-info">
<span>Recovery Phone</span>
</div>
<button class="privacy-btn">Setup</button>
</div>

<div class="privacy-row">
<div class="privacy-row-info">
<span>Deactivate Account</span>
</div>
<button class="privacy-btn danger">Deactivate</button>
</div>

</div>

</div>

</main>
</div>

<div id="toast">Changes Saved</div>

<script>

function showTab(name,btn){
document.querySelectorAll('.tab-panel')
.forEach(p=>p.classList.remove('active'));

document.getElementById('tab-'+name)
.classList.add('active');

document.querySelectorAll('.nav-item')
.forEach(b=>b.classList.remove('active'));

btn.classList.add('active');
}

function previewAvatar(e){
const file=e.target.files[0];
if(!file)return;

const reader=new FileReader();
reader.onload=ev=>{
avatarEl.innerHTML=
'<img src="'+ev.target.result+'">';
};
reader.readAsDataURL(file);
}

function removeAvatar(){
avatarEl.innerHTML="WA";
}

function showToast(){
const t=document.getElementById('toast');
t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2000);
}

</script>





 <script src="../../data.js"></script>
    <script src="./account.js"></script>
    <script src="../../script.js"></script>


</body></html>
