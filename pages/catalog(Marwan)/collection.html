<!DOCTYPE html><html><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maktaba</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="./catalog.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&amp;family=GFS+Didot&amp;family=Jost:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&amp;family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&amp;family=GFS+Didot&amp;family=Jost:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&amp;display=swap" rel="stylesheet">
      <link rel="icon" type="image/svg + xml" sizes="64x64" href="../../resources/asset/Logo.svg">

  

</head>

<body>
    <nav class="navbar ">
        <div id="Maktaba">
            <a href="#Maktaba">
                <h1>Maktaba</h1>
            </a>
        </div>
        <ul class="navrbar-text">
            <li>
                <a href="../../home.html">
                    Home
                </a>
            </li>
            <li>
                <a href="./genres.html">
                    Browse
                </a>
            </li>
            <li>
                <a href="./collection.html" class="active-link">
                    Collection
                </a>
            </li>
            <li>
                <a href="../account(Mikha)/favorites.html">
                    Favourites
                </a>
            </li>
        </ul>
        <div class="navbar-icons">
            <a href="../checkout(Rojeh)/add-to-cart.html">
                <span class="material-symbols-outlined">shopping_bag</span>
            </a>
            <div class="menu-dropdown-wrapper" id="menuWrapper">
                <span class="material-symbols-outlined" id="menuBtn">menu</span>
            </div>
            <div class="menu-dropdown" id="menuDropdown">
                <a href="../authentication(Ali)/signup.html">Profile</a>
                <a href="../account(Mikha)/settings.html">Settings</a>
                <a href="../account(Mikha)/contact-us.html" class="contact-placeholder">Contact Us</a>
            </div>
        </div>
    </nav>

    <div class="collection-page">

        <!-- Page header — text left, image right -->
        <div class="collection-header">
            <div class="collection-header-text">
                <p class="collection-subtitle">— Browse</p>
                <h1 class="collection-heading">All Books</h1>
            </div>
            <img class="collection-header-img" src="../../resources/img/CollectionsImg.png" alt="Maktaba Collection">
        </div>

        <!-- Controls bar: count | filters | sort | search -->
        <div class="collection-controls">
            <span class="collection-count" id="book-count"></span>
            <div class="collection-actions">
                <button id="toggleBtn" class="ctrl-btn">
                    <span class="material-symbols-outlined">tune</span>
                    Filters
                </button>
                <div class="sort-wrapper">
                    <button class="ctrl-btn" id="sortBtn">Sort by ▾</button>
                    <div class="sort-panel" id="sortPanel">
                        <a href="#" data-sort="default">Default</a>
                        <a href="#" data-sort="price-asc">Price: Low → High</a>
                        <a href="#" data-sort="price-desc">Price: High → Low</a>
                        <a href="#" data-sort="title">Title A–Z</a>
                    </div>
                </div>
                <div class="collection-search-wrap">
                    <span class="material-symbols-outlined">search</span>
                    <input class="search-input" id="searchBtn" type="search" placeholder="Search by title, author or genre…">
                </div>
            </div>
        </div>

        <!-- Genre filter panel (toggled by #toggleBtn) -->
        <div id="expandBox" class="collection-filters">
            <p class="filter-label">Genre</p>
            <div class="line">
                <a href="#" data-genre="all" class="filter-active">All</a>
                <a href="#" data-genre="Fantasy">Fantasy</a>
                <a href="#" data-genre="Horror">Horror</a>
                <a href="#" data-genre="Thriller">Thriller</a>
                <a href="#" data-genre="Science-Fiction">Science Fiction</a>
                <a href="#" data-genre="Adventure">Adventure</a>
                <a href="#" data-genre="Drama">Drama</a>
            </div>
        </div>

        <!-- Book grid -->
        <div id="books-container" class="collection-grid"></div>

    </div>
    

<script src="../../data.js"></script>
    <script src="./catalog.js"></script>
    <script src="../../script.js"></script>



</body></html>
