<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

<link rel="stylesheet" href="./auth.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="auth.js"></script>
</head>


</head>

<body>

<h1>𝐷𝑎𝑠ℎ𝑏𝑜𝑎𝑟𝑑</h1><br>






















</div>

<!-- Overlay -->
<div class="overlay" onclick="toggleMenu()"></div>

<div class="dashboard">

  <div class="auth-card" onclick=goToBooks()>
    <h2>32</h2>
    <p>📖</p><br>
    <p>Total Books</p>
  </div>

  <div class="auth-card" onclick=goToAuthors()>
    <h2>9</h2>
    <p>✒️</p><br>
    <p>Total Authors</p>
  </div>

  <div class="auth-card">
    <h2>#</h2>
    <p>Revenue</p>
  </div>

  <div class="auth-card">
    <h2>27</h2>
    <p>🛒</p><br>
    <p>Orders</p>
  </div>

  <div class="auth-card">
    <h2>$10.65</h2>
    <p>💰</p><br>
    <p>ToTal</p>
  </div>

</div>

<div class="row">

  <div class="card revenue-card" style="width: 100%; max-width: 1350px; box-sizing: border-box; padding: 1.25rem 1.5rem;">
  <div style="display:flex; align-items:flex-start; gap:2rem; margin-bottom:1.25rem; flex-wrap:wrap;">
    <h3 style="font-size:18px; font-weight:500; margin:0;">Revenue Overview</h3>
    <div style="display:flex; gap:2rem;">
      <div>
        <div style="font-size:11px; color:#888; text-transform:uppercase; letter-spacing:0.06em;">Book Revenue</div>
        <div style="font-size:22px; font-weight:500;">$48,250</div>
      </div>
      <div>
        <div style="font-size:11px; color:#888; text-transform:uppercase; letter-spacing:0.06em;">Books Sold</div>
        <div style="font-size:22px; font-weight:500;">1,310</div>
      </div>
    </div>
  </div>

  <div style="width:100%; height:200px; position:relative;">
    <canvas id="revenueChart"></canvas>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="your-script.js"></script>





<div class="card" style="width: 320px; padding: 1rem;">
  <div style="display:flex; align-items:flex-start; gap:1rem; margin-bottom:0.75rem;">
    <p style="font-size:15px; font-weight:500; margin:0;">Genre Breakdown</p>
    <p style="font-size:12px; color:#888; margin:0; padding-top:2px;">Sales share by genre</p>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:1rem;">
    <canvas id="genreChart" style="width:150px !important; height:150px !important; max-width:150px;"></canvas>
    <div id="genreLegend" style="width:100%;"></div>
  </div>
</div>





  <div class="auth-card" style="padding: 1.25rem 1.5rem;">
  <p style="font-size:15px; font-weight:500; margin:0 0 2px; display:block;">Top Selling Books</p>
  <p style="font-size:12px; color:#888; margin:0 0 1rem; display:block;">Units sold, all time</p>
  <div style="width:100%; height:220px; position:relative; display:block;">
    <canvas id="topBooksChart"></canvas>
  </div>
</div>



  <div class="auth-card" style="padding: 1.25rem 1.5rem; width: 100%; box-sizing: border-box;">
  <p style="font-size:15px; font-weight:500; margin:0 0 2px; display:block;">Weekly Visitors</p>
  <p style="font-size:12px; color:#888; margin:0 0 1rem; display:block;">Store page visits this week</p>

  <div style="width:100%; height:180px; position:relative; display:block;">
    <canvas id="visitorsChart"></canvas>
  </div>

  <div style="display:flex; justify-content:space-between; margin-top:1rem; padding-top:0.75rem; border-top:0.5px solid #e0e0e0;">
    <span style="font-size:12px; color:#888;">Peak Day</span>
    <span style="font-size:12px; font-weight:500;" id="peakDay"></span>
  </div>
</div>
</div>






<div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; width:100%;">
  
  <div class="lsection" id="quickMetricsCard"></div>
  <div class="lsection" id="recentActivityCard"></div>
  <div class="lsection" id="lowStockCard"></div>

</div>
</body>
</html>
